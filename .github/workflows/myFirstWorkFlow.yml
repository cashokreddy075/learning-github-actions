
name: updatedActions
on: 
  push: 
jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-22.04
    steps:
      - name: step-1
        run: |
          pwd
          ls -ltr
          hostname
      - name: step2 -Checkout
        uses: actions/checkout@v5.1.0
      - name: step-3
        run: |
          echo "pwd" >> myartifact.txt 
          mkdir arifacts
          echo 'ls -ltr' >> artifacts/list.txt
          echo hostname >> arifacts/hostname.txt
      - name: Upload Single file
        uses: actions/upload-artifact@v7
        with:
          name: Single_File
          path: ./myartifact.txt
      - name: UploadFromDirectorty
        uses: actions/upload-artifact@v7
        with:
          name: directory_artifacts
          path: artifacts/
      - name: Upload From Multiple Path
        uses: actions/upload-artifact@v7
        with:
          name: multiplepaths
          path: |
            ./myartifact.txt
            artifacts/
            :**/hostname.txt
