
name: my-first-workflow

on:
  push:
    branches:
      - dev
      - 'feature-*'
jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-22.04

    steps:
      - name: step-1
        run: |
          pwd
          ls -ltr
          hostname

      - name: step-2-checkout
        uses: actions/checkout@v4

      - name: step-3-create-files
        run: |
          echo 'pwd' > myartifact.txt
          mkdir -p artifacts
          echo 'ls-ltr' > artifacts/list.txt
          echo 'hostname' > artifacts/hostname.txt

      - name: Upload Single File
        uses: actions/upload-artifact@v4
        with:
          name: single_file
          path: ./myartifact.txt

  job2:
    name: JOB2
    needs: job1
    runs-on: ubuntu-22.04

    steps:
      - name: Checking current directory before download
        run: |
          pwd
          ls -ltr

      - name: Download single file artifact
        uses: actions/download-artifact@v4
        with:
          name: single_file

      - name: Checking current directory after download
        run: |
          pwd
          ls -ltr
          cat myartifact.txt
