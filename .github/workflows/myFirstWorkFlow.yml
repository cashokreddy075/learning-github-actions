
name: updatedActions

on:
  push:

jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-22.04

    steps:
      - name: Step 1 - Check runner details
        run: |
          pwd
          ls -ltr
          hostname

      - name: Step 2 - Checkout
        uses: actions/checkout@v5

      - name: Step 3 - Create files and directories
        run: |
          echo "pwd" > myartifact.txt
          mkdir -p artifacts
          echo "ls -ltr" > artifacts/list.txt
          hostname > artifacts/hostname.txt

      - name: Upload Single File
        uses: actions/upload-artifact@v7
        with:
          name: Single_File
          path: ./myartifact.txt

      - name: Upload From Directory
        uses: actions/upload-artifact@v7
        with:
          name: directory_artifacts
          path: artifacts/

      - name: Upload From Multiple Paths
        uses: actions/upload-artifact@v7
        with:
          name: multiplepaths
          path: |
            ./myartifact.txt
            artifacts/
            **/hostname.txt
