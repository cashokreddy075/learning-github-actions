
name: my-first-workflow

on:
  push:
    branches:
      - dev
      - 'feature-*'

jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-22.04

    steps:
      - name: Step 1 - Check Runner
        run: |
          pwd
          ls -ltr
          hostname

      - name: Step 2 - Checkout Code
        uses: actions/checkout@v4

      - name: Step 3 - Create Files
        run: |
          pwd > myartifact.txt
          mkdir -p artifacts
          ls -ltr > artifacts/list.txt
          hostname > artifacts/hostname.txt

      - name: Step 4 - Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-build
          path: |
            myartifact.txt
            artifacts/

  job2:
    name: JOB2
    needs: job1
    runs-on: ubuntu-22.04

    steps:
      - name: Step 1 - Check Before Download
        run: |
          pwd
          ls -ltr

      - name: Step 2 - Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: my-build
          path: downloaded

      - name: Step 3 - Verify Downloaded Files
        run: |
          ls -R downloaded
          cat downloaded/myartifact.txt
          cat downloaded/artifacts/list.txt
          cat downloaded/artifacts/hostname.txt
